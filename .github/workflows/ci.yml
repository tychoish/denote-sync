name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v5

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@v0.1.3
        with:
          fail-on-warning: "false"

      # the Markdown tree-sitter grammars are built on first use (see
      # `mdwn-install-grammars'), and the -ci images ship no C compiler
      - name: Install C compiler for tree-sitter grammars
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev

      - name: Run Tests
        uses: tychoish/elisp-ci@v0.1.3
        with:
          dependencies: denote-dash
